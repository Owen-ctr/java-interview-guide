<!--
  品牌标记 favicon（与 logo.svg 同一几何）
  刻意不依赖内联样式：基准色用「表现属性」写死为品牌 indigo，因此即使浏览器在
  favicon 渲染上下文里忽略内联 <style>，它依然可见；内联 media query 只做「升级」，
  深色标签栏下换成更亮的 indigo。不支持 SVG favicon 的浏览器走 favicon-32.png 兜底。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    @media (prefers-color-scheme: dark) {
      .mark-ring { stroke: #a8b1ff; }
      .mark-node { fill: #a8b1ff; }
    }
  </style>
  <circle class="mark-ring" cx="11" cy="11" r="7.2" stroke="#3451b2" stroke-width="3.2"/>
  <circle class="mark-node" cx="18.4" cy="18.4" r="3.1" fill="#3451b2"/>
</svg>
