<!--
  首页 hero 大图（亮色主题版）
  内容就是品牌标记本体的等比放大（24 视口 ×7.047），与导航栏 logo 完全同构。
  viewBox 已收紧到标记外接框 +8 单位留白（标记占 136.025/152 ≈ 89.5%），
